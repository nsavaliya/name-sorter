name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test on Linux
        if: runner.os != 'Windows'
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Build and test on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify
      - name: Check packaged command output
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./name-sorter examples/unsorted-names-list.txt > actual-names.txt
          diff -u examples/expected-sorted-names-list.txt actual-names.txt
          diff -u examples/expected-sorted-names-list.txt sorted-names-list.txt
